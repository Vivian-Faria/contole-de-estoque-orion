[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Rotas do app (React) caem no index.html.
# As funções em /.netlify/functions/* são tratadas antes disto.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
